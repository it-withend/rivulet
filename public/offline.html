<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline — Rivulet</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eeede5; color: #151b1c; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 30rem; padding: 1.5rem; }
    h1 { font: italic 2rem/1.2 Georgia, serif; margin: 0 0 .75rem; }
    p { margin: 0 0 1rem; }
    a { display: inline-block; padding: .6rem 1rem; border-radius: 2px; background: #185157; color: #eeede5; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>You are offline</h1>
    <p>Rivulet could not reach the network. If you are at a stream, you can still fill in a report: it is saved on this phone and sent by itself when the connection is back.</p>
    <p><a href="/observe">Check a stream</a></p>
  </main>
</body>
</html>
